<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Portal</title>
  <!-- Link to external CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header with Navigation -->
  <header>
    <h1>Course Portal</h1>
    <nav>
      <ul>
        <li><a href="#overview">Overview</a></li>
        <li><a href="#courses">Courses</a></li>
        <li><a href="#enroll">Enroll</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Section 1 -->
    <section id="overview">
      <h2>Overview</h2>
      <p>Welcome to the Course Portal. Explore our programs and enroll easily.</p>
    </section>

    <!-- Section 2 -->
    <section id="courses">
      <h2>Courses Offered</h2>
      <figure>
        <img src="students.jpg" alt="Group of students collaborating in class">
        <figcaption>Interactive learning in our featured courses.</figcaption>
      </figure>
    </section>

    <!-- Section 3 -->
    <section id="enroll">
      <h2>Enrollment Form</h2>
      <form action="#" method="post">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>

        <label for="course">Select Course:</label>
        <select id="course" name="course">
          <option value="webdev">Web Development</option>
          <option value="mad">Mobile Applications Development</option>
          <option value="ap">Adcvanced Programming</option>
        </select>

        <!-- Extended fields -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">

        <input type="submit" value="Enroll Now">
      </form>
    </section>
  </main>

  <!-- Sidebar -->
  <aside>
    <h2>Announcements</h2>
    <p>Stay tuned for upcoming workshops and new course launches.</p>
  </aside>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Course Portal. All rights reserved.</p>
  </footer>
</body>
</html>
